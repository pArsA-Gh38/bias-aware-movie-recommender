[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recommender-core"
version = "0.1.0"
description = "Deterministic runtime inference primitives for movie-recommender"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.3",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/recommender_core"]
