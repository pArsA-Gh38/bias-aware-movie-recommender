[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.141.1",
    "pyarrow>=25.0.0",
    "pwdlib[argon2]>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.15.1,<3",
    "recommender-core",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.52.3",
]

[tool.uv.sources]
recommender-core = { path = "../packages/recommender_core" }

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
