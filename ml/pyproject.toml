[project]
name = "ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "implicit>=0.7.3",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "recommender-core",
    "scipy>=1.17.1",
]

[tool.uv.sources]
recommender-core = { path = "../packages/recommender_core" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

addopts = "-m 'not realdata'"
markers = ["realdata: requires locally prepared MovieLens data; excluded from default public CI"]
