name: Feature request
description: Propose a bounded change with a concrete use case.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected workflow
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and validation
      description: Describe how success would be checked; research changes need a separate protocol.
