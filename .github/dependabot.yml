version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      next-framework:
        patterns:
          - next
          - eslint-config-next
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
# Numerical Python updates need explicit artifact/provenance review; do not automate them blindly.
